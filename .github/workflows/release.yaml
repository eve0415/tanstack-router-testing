name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: 'https://registry.npmjs.org/'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter="./packages/*" run build

      - name: Copy README into packages
        run: |
          for pkg in packages/*/; do
            cp README.md "$pkg/README.md"
          done

      - name: Publish packages
        run: |
          for pkg in \
            packages/router-testing-core \
            packages/react-start-testing \
            packages/react-router-testing; do
            name=$(jq -r .name "$pkg/package.json")
            version=$(jq -r .version "$pkg/package.json")
            view_out=$(npm view "$name@$version" version 2>&1) && {
              echo "::notice::$name@$version already published — skipping"
              sleep 10
              continue
            }
            if echo "$view_out" | grep -q "E404"; then
              echo "Publishing $name@$version"
              pnpm publish "$pkg" --provenance --access public --no-git-checks
            else
              echo "::error::npm view failed unexpectedly: $view_out"
              exit 1
            fi
            sleep 10
          done

      - name: Pack tarballs for attestation
        run: |
          mkdir -p attestation-subjects
          dest="$(pwd)/attestation-subjects"
          for pkg in packages/*/; do
            (cd "$pkg" && pnpm pack --pack-destination "$dest")
          done
          echo "=== Attestation subjects ==="
          ls -l attestation-subjects/
        env:
          npm_config_ignore_scripts: true

      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: attestation-subjects/*.tgz

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04-arm
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
