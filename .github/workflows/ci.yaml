name: ci
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter="./packages/*" run build

  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter="./packages/*" run build

      - name: Lint
        run: pnpm exec oxlint --report-unused-disable-directives --ignore-path .oxlintignore

  format:
    name: Format
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec oxfmt --check

  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter="./packages/*" run build

      - name: Core unit tests
        run: |
          pnpm --filter=@tanstack-router-testing/router-testing-core exec vitest run --passWithNoTests
          pnpm --filter=@tanstack-router-testing/react-start-testing exec vitest run --passWithNoTests
          pnpm --filter=@tanstack-router-testing/react-router-testing exec vitest run tests/integration src --passWithNoTests

      - name: Vendored parity
        run: node scripts/check-vendor-test-parity.mjs

      - name: Prepare vendored tests
        run: node scripts/gen-vendor-smoke-tests.mjs

      - name: Vendored examples
        run: pnpm --filter=@tanstack-router-testing/react-router-testing exec vitest run tests/vendored/examples-react --passWithNoTests

      - name: Vendored React Router e2e apps
        run: pnpm --filter=@tanstack-router-testing/react-router-testing exec vitest run tests/vendored/e2e-react-router --passWithNoTests

      - name: Vendored React Start e2e apps
        run: pnpm --filter=@tanstack-router-testing/react-router-testing exec vitest run tests/vendored/e2e-react-start --passWithNoTests

  coverage:
    name: Coverage
    needs: [build, lint, format, test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter="./packages/*" run build

      - name: Generate coverage
        run: |
          {
            pnpm --filter=@tanstack-router-testing/router-testing-core exec vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text
            pnpm --filter=@tanstack-router-testing/react-start-testing exec vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text
            pnpm --filter=@tanstack-router-testing/react-router-testing exec vitest run tests/integration src --coverage --coverage.reporter=json-summary --coverage.reporter=text --passWithNoTests
          } 2>&1 | tee coverage.txt
          {
            echo '## Coverage Report'
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
          } > coverage.md
          if [ "$(wc -c < coverage.md)" -gt 60000 ]; then
            {
              echo '## Coverage Report'
              echo ''
              echo '> Truncated to fit GitHub comment limits. See CI logs for full report.'
              echo ''
              echo '```'
              head -2 coverage.txt
              echo '  ...'
              tail -2 coverage.txt
              echo '```'
            } > coverage.md
          fi

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage.md
