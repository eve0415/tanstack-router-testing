name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: build · lint · test · types
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint + format check
        run: pnpm run lint:check

      - name: Core unit tests
        run: pnpm run test:unit:core

      - name: Vendored parity
        run: pnpm run test:vendored:parity

      - name: Vendored examples
        run: pnpm run test:unit:vendored:examples

      - name: Vendored React Router e2e apps
        run: pnpm run test:unit:vendored:e2e-router

      - name: Vendored React Start e2e apps
        run: pnpm run test:unit:vendored:e2e-start

      - name: Type tests
        run: pnpm run test:types
