linkWorkspacePackages: true
preferWorkspacePackages: true

# Vendored apps under vendor/ are intentionally NOT in the workspace:
# they reference upstream TanStack packages via `workspace:*` that don't
# exist here. Each vendored app resolves its own deps on-demand when the
# harness targets it. See vendor/VENDOR.md.
packages:
  - 'packages/*'
  - '!**/node_modules/**'
sharedWorkspaceLockfile: true
publicHoistPattern:
  - '*react*'
  - '@tanstack/*'
  - '@testing-library/*'
allowBuilds:
  '@clerk/shared': false
  '@firebase/util': false
  '@parcel/watcher': false
  esbuild: false
  protobufjs: false
